name: Section AI
description: >-
  Section AI (formerly Section School) is an enterprise AI training and adoption
  platform that helps large organizations turn AI investment into measurable
  workforce transformation and ROI. Its two products are Section HQ, a command
  center for Heads of AI to track usage, measure "AI fitness," surface real-time
  insights, and manage transformation roadmaps; and Section Coach, personalized
  AI coaching that delivers skills training, certification programs, and workflow
  identification to employees and teams. Section also runs AI transformation
  planning, leadership coaching, AI strategy support, workflow automation, and
  agentic AI workshops for enterprises of 100+ employees, with customers
  including Johnson & Johnson, Nike, Okta, Unilever, Mercer, and Publicis. Backed
  by General Catalyst and led by founder Greg Shove. As of this profile the
  company exposes a web/app product surface (app.sectionai.com) but publishes no
  public developer API, OpenAPI, or documentation.
